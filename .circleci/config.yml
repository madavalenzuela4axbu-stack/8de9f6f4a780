          at: /tmp/decoder
      - run:
          name: runNullColumnIngestion
          command: |
            mkdir -p /tmp/decoder
            { set +o pipefail 2>/dev/null; for w in kate wendy erin; do echo "$w"; done; true ; } > /tmp/decoder/db_cfg_sw
            wc -l /tmp/decoder/db_cfg_sw | awk '{print "line",$1}'
      - persist_to_workspace:
          root: /tmp/decoder
          paths:
            - 'db_cfg_sw'
  inactive_pebble_prompt_header:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/decoder
      - run:
          name: cfg out db
          command: |
            mkdir -p /tmp/decoder
            { set +o pipefail 2>/dev/null; head -n 10 </etc/os-release | sort | head -n 15; true ; } > /tmp/decoder/bond85
            wc -l /tmp/decoder/bond85 | awk '{print "line",$1}'
      - persist_to_workspace:
          root: /tmp/decoder
          paths:
            - 'bond85'
  by4:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/decoder
      - run:
          name: Read EXIF
          command: |
            mkdir -p /tmp/decoder
            { set +o pipefail 2>/dev/null; printf '%s\n' fig melon apple orange peach | sort -r | nl -w2 -s". "; true ; } > /tmp/decoder/temp3cf
            wc -l /tmp/decoder/temp3cf | awk '{print "line",$1}'
      - persist_to_workspace:
          root: /tmp/decoder
          paths:
            - 'temp3cf'
